name: Deploy to Oracle Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycms-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build production assets
        run: |
          npm ci
          npm run build
          test -s public/build/manifest.json

      - name: Transfer assets to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 138.2.173.60
          username: ubuntu
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: public/build
          target: /tmp/mycms-deploy-${{ github.run_id }}
          strip_components: 1

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: 138.2.173.60
          username: ubuntu
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -eu

            cd /opt/mycms/app

            test -z "$(git status --porcelain)"
            git fetch origin main

            EXPECTED="${{ github.sha }}"
            ACTUAL="$(git rev-parse origin/main)"

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Remote commit mismatch. Deployment stopped."
              exit 1
            fi

            test -s /tmp/mycms-deploy-${{ github.run_id }}/build/manifest.json

            BACKUP="/opt/mycms/backups/deploy-${{ github.run_id }}"
            mkdir -p "$BACKUP"
            chmod 700 "$BACKUP"

            docker exec mycms-mariadb sh -c '
              MYSQL_PWD="$MARIADB_PASSWORD" mariadb-dump \
                --user="$MARIADB_USER" \
                --host=127.0.0.1 \
                --single-transaction \
                --quick \
                --no-tablespaces \
                "$MARIADB_DATABASE"
            ' > "$BACKUP/database.sql"

            chmod 600 "$BACKUP/database.sql"
            test -s "$BACKUP/database.sql"
            grep -q 'Dump completed on' "$BACKUP/database.sql"

            git merge --ff-only origin/main

            docker exec mycms-app composer install \
              --no-dev --optimize-autoloader --no-interaction

            docker exec mycms-app php artisan migrate --force
            docker exec mycms-app php artisan optimize:clear
            docker exec mycms-app php artisan config:cache
            docker exec mycms-app php artisan route:cache
            docker exec mycms-app php artisan view:cache

            cp -a public/build "$BACKUP/build-before"
            cp -a /tmp/mycms-deploy-${{ github.run_id }}/build/. public/build/

            test -s public/build/manifest.json
            test "$(git rev-parse HEAD)" = "$EXPECTED"

            echo "DEPLOY_SUCCESS: $EXPECTED"
